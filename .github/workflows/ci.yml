name: CI/CD Pipeline

on:
  push:
    branches: [master, feat/plugin_refactor]
  pull_request:
    branches: [master, feat/plugin_refactor]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up latest Python
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e .

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=pyH2A --cov-report=xml --cov-report=term-missing src/tests/ -v

      - name: Create badge directory
        run: mkdir -p src/pyH2A/Other/badges

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: src/pyH2A/Other/badges/coverage_badge.svg

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: src/pyH2A/Other/badges/coverage_badge.svg
