# Install the git hook once with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock
    rev: v0.16.10
    hooks:
      # Lint and apply safe fixes
      - id: ruff-check
        args: [--fix]
      # Format
      - id: ruff-format